<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ronda DM</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 320px;
      background: #121510;
      color: #e8e9df;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      padding: 16px;
    }
    .head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .mark {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      border: 1px solid #536243;
      background: #1b2218;
      color: #cfe0a6;
      display: grid;
      place-items: center;
      font-family: Georgia, serif;
      font-size: 20px;
      font-style: italic;
    }
    h1 {
      margin: 0;
      font-size: 16px;
      font-family: Georgia, serif;
    }
    .sub {
      display: block;
      font-size: 11px;
      color: #959d8d;
      margin-top: 2px;
    }
    .stack {
      display: grid;
      gap: 8px;
    }
    button {
      width: 100%;
      min-height: 40px;
      border-radius: 7px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 12px;
    }
    .primary {
      border: 0;
      background: #bad28b;
      color: #172013;
    }
    .primary:hover { background: #cbe29f; }
    .secondary {
      border: 1px solid #414b38;
      background: #1a2017;
      color: #e2e8d6;
    }
    .secondary:hover { border-color: #71835b; background: #232b1f; }
    .sync-box {
      margin-top: 12px;
      padding: 11px;
      border-radius: 8px;
      border: 1px solid #353f2e;
      background: #171b15;
    }
    .sync-box small {
      display: block;
      font-size: 11px;
      color: #9ca492;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .status {
      margin-top: 8px;
      font-size: 11px;
      color: #c8db9e;
      min-height: 16px;
      line-height: 1.4;
    }
    .status.err { color: #eea596; }
  </style>
</head>
<body>
  <div class="head">
    <span class="mark">R</span>
    <div>
      <h1>Ronda — Panel DM</h1>
      <span class="sub">D&amp;D 2024 · Dados físicos</span>
    </div>
  </div>

  <div class="stack">
    <button type="button" class="primary" id="openSidePanel">◫ Abrir Panel Lateral (al lado de Nivel20)</button>
    <button type="button" class="secondary" id="openFullTab">↗ Panel DM Completo (Pestaña)</button>
    <button type="button" class="secondary" id="openDmMapPopupBtn">🗺 Mapa DM Completo (Pestaña aparte)</button>
    <button type="button" class="secondary" id="openPlayerMapPopupBtn">🖥 Mapa Jugadores · Niebla de Guerra</button>
  </div>

  <div class="sync-box">
    <small id="tabHint">Abre la <b>página de tu campaña</b> (trae todos los retratos a la vez) o la <b>hoja de un personaje</b> en <b>nivel20.com</b> y pulsa sincronizar:</small>
    <button type="button" class="secondary" id="syncBtn">⟳ Sincronizar retratos / ficha de Nivel20</button>
    <div class="status" id="statusMsg"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
