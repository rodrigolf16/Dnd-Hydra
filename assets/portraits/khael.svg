<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#354a34"/>
      <stop offset="55%" stop-color="#1a241b"/>
      <stop offset="100%" stop-color="#0d110e"/>
    </radialGradient>
    <linearGradient id="cloak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b3d28"/>
      <stop offset="100%" stop-color="#131b13"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8b594"/>
      <stop offset="100%" stop-color="#a88062"/>
    </linearGradient>
  </defs>
  <rect width="320" height="320" fill="url(#bg)"/>
  <!-- Moonlit forest aura -->
  <circle cx="245" cy="68" r="36" fill="#d8e7b0" opacity="0.16"/>
  <circle cx="245" cy="68" r="22" fill="#e6f2c7" opacity="0.22"/>
