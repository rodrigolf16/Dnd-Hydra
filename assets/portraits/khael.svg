  <path d="M114 126 C114 96 135 84 160 84 C185 84 206 96 206 126 C206 164 185 198 160 202 C135 198 114 164 114 126 Z" fill="url(#skin)"/>
  <!-- Shadow under hood -->
  <path d="M112 126 C118 90 138 80 160 80 C182 80 202 90 208 126 C188 112 132 112 112 126 Z" fill="#1b2419" opacity="0.58"/>
  <!-- Hair -->
  <path d="M112 122 C116 86 142 78 166 80 C196 82 208 102 208 128 C196 108 182 102 158 104 C135 106 122 116 112 122 Z" fill="#3a2d21"/>
  <!-- Eyes (glowing gloom stalker emerald) -->
  <ellipse cx="140" cy="142" rx="8" ry="4" fill="#182018"/>
  <ellipse cx="180" cy="142" rx="8" ry="4" fill="#182018"/>
  <circle cx="140" cy="142" r="3" fill="#bad28b"/>
  <circle cx="180" cy="142" r="3" fill="#bad28b"/>
