  <path d="M128 134 Q140 130 150 136 M170 136 Q180 130 192 134" stroke="#2d2219" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M158 144 L156 162 L163 163" stroke="#8a654a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M148 176 Q160 180 172 175" stroke="#724c3b" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <!-- Hand crossbow / dagger glint -->
  <path d="M236 250 L282 212 L272 266 Z" fill="#8f9c88" opacity="0.7"/>
  <path d="M244 260 L276 232" stroke="#d5e5b3" stroke-width="2.5" opacity="0.8"/>
