  <path d="M95 215 Q160 250 225 215 L245 320 L75 320 Z" fill="#2c241c" stroke="#4c3d2d" stroke-width="2"/>
  <path d="M110 218 L210 318 M210 218 L110 318" stroke="#5f4a34" stroke-width="8" opacity="0.85"/>
  <circle cx="160" cy="268" r="9" fill="#c7b273" stroke="#5c4c2a" stroke-width="2"/>
